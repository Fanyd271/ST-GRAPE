[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stgrape"
version = "1.0.0"
description = "Structure-aware Suzuki-Trotter GRAPE for robust quantum control"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yidian Fan"}, {name = "Re-Bing Wu"}]
keywords = ["quantum-control", "GRAPE", "Suzuki-Trotter", "robust-control"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics"]
dependencies = ["numpy>=1.26", "scipy>=1.13", "qutip>=5.0", "matplotlib>=3.8", "Pillow>=10"]

[project.urls]
Repository = "https://github.com/Fanyd271/ST-GRAPE"
Issues = "https://github.com/Fanyd271/ST-GRAPE/issues"
Paper = "https://doi.org/10.1103/959l-ms9v"
Preprint = "https://arxiv.org/abs/2506.18590"

[project.scripts]
stgrape = "stgrape.cli:main"
stgrape-crop-pdf = "stgrape.pdf_crop:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.400", "build>=1.2", "cffconvert>=2"]
notebook = ["ipykernel>=6.29", "jupyterlab>=4", "nbclient>=0.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/stgrape"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src/stgrape"]
exclude = ["src/stgrape/analysis/_*_plot.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
